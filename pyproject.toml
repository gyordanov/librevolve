[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "librevolve"
version = "0.1.0"
description = "Bluetooth control for the Revopoint Dual-Axis Turntable (DAT)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
revolve = "librevolve.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "hardware: requires a physical Revopoint DAT (set LIBREVOLVE_DEVICE)",
]
testpaths = ["tests"]
